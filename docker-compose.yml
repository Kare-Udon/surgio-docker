services:
  surgio:
    image: laoliu233/surgio-docker:latest # or ghcr.io/kare-udon/surgio-docker:latest
    build: .
    restart: unless-stopped
    container_name: surgio
    ports:
        - "23000:3000"
    volumes:
        - ./config:/var/config:ro
    environment:
      AUTOGEN_INTERVAL: 1h # 格式：xh | xm | xhym
