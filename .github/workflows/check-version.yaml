name: Get latest release version
on:
  workflow_dispatch:
  schedule:
    - cron:  '0 13 * * *'
jobs:
  get-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.REPO_SCOPED_TOKEN }}
      - name: Fetch release version
        run: |
          curl -fsSL --max-time 30 https://api.github.com/repos/surgioproject/surgio/releases/latest | \
          jq -er '.tag_name | select(test("^(surgio@|v)?4\\.[0-9]+\\.[0-9]+$"))' > release-versions/surgio-latest.txt
      - name: Check for modified files
        id: git-check
        run: |
          if git diff --quiet -- release-versions/surgio-latest.txt; then
            echo "modified=false" >> "$GITHUB_OUTPUT"
          else
            echo "modified=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit latest release version
        if: steps.git-check.outputs.modified == 'true'
        run: |
          git config --global user.name 'Kare-Udon'
          git config --global user.email 'git@udon.eu.org@users.noreply.github.com'
          git commit -am "New release version"
          git push
