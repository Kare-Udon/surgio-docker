name: Build and publish Docker image

on:
  workflow_dispatch:
  push:
    paths:
      - 'release-versions/*'
      - 'Dockerfile'
      - 'docker-entrypoint.sh'
      - 'gateway.mjs'
      - 'runtime.mjs'
      - 'tests/**'
      - '.dockerignore'
      - '.github/workflows/docker-image.yaml'

permissions:
  contents: read

env:
  REGISTRY_IMAGE: laoliu233/surgio-docker

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Test configuration reload and recovery
        run: node --test tests/runtime.test.mjs
      - name: Build smoke test image
        run: |
          VERSION=$(cat release-versions/surgio-latest.txt)
          VERSION=${VERSION#surgio@}
          VERSION=${VERSION#v}
          docker build --build-arg "SURGIO_VERSION=$VERSION" -t surgio-docker:v4-local .
      - name: Test real Surgio and Gateway in Docker
        run: node tests/docker-smoke.mjs

  build:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.vars.outputs.version }}
      ghcr_image: ${{ steps.vars.outputs.ghcr_image }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get latest release version
        id: vars
        run: |
          VERSION=$(cat release-versions/surgio-latest.txt)
          VERSION=${VERSION#surgio@}
          VERSION=${VERSION#v}
          [[ "$VERSION" =~ ^4\.[0-9]+\.[0-9]+$ ]]
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "ghcr_image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: SURGIO_VERSION=${{ steps.vars.outputs.version }}
          outputs: |
            type=image,"name=${{ env.REGISTRY_IMAGE }},${{ steps.vars.outputs.ghcr_image }}",push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          plat_safe=$(echo "${{ matrix.platform }}" | tr '/' '-')
          echo "PLAT_SAFE=$plat_safe" >> "$GITHUB_ENV"
          echo "${digest#sha256:}" > "/tmp/digests/${plat_safe}.sha256"

      - name: Upload digest (one per platform)
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLAT_SAFE }}
          path: /tmp/digests/*.sha256
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        registry: [dockerhub, ghcr]
    env:
      VERSION: ${{ needs.build.outputs.version }}
      REGISTRY_IMAGE: ${{ matrix.registry == 'ghcr' && needs.build.outputs.ghcr_image || 'laoliu233/surgio-docker' }}
    steps:
      - name: Download all digests
        uses: actions/download-artifact@v4
        with:
          pattern: digests-*
          path: /tmp/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=${{ env.VERSION }}
            type=raw,value=latest
            type=sha

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(for digestfile in *.sha256; do printf '${{ env.REGISTRY_IMAGE }}@sha256:%s ' "$(cat "$digestfile")"; done)

      - name: Inspect image
        run: docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE }}:${{ steps.meta.outputs.version }}
